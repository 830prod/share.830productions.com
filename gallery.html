<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031F33">
<title>Gallery · 830 Productions</title>
<link rel="icon" href="assets/reel-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .hero {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 28px 40px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border-on-dark); margin-bottom: 24px;
  }
  .hero .btn-row { margin-top: 28px; }
  .count { font: 300 clamp(48px, 7vw, 72px)/1 var(--font-display); color: var(--white); margin: 0; text-align: right; }
  .count small { display: block; font: 600 11px/1 var(--font-display); letter-spacing: .28em; text-transform: uppercase; color: var(--haze); margin-top: 10px; }
  @media (max-width: 600px) { .count { text-align: left; display: flex; align-items: baseline; gap: 12px; font-size: 40px; } .count small { margin: 0; } }

  .grid { columns: 4 240px; column-gap: 8px; }
  @media (max-width: 520px) { .grid { columns: 2; column-gap: 6px; } }
  .shot {
    display: block; width: 100%; margin: 0 0 8px; padding: 0; border: 0; background: var(--harbor);
    break-inside: avoid; cursor: zoom-in; overflow: hidden; position: relative; min-height: 80px;
  }
  @media (max-width: 520px) { .shot { margin-bottom: 6px; } }
  .shot img { width: 100%; height: auto; opacity: 0; transition: transform var(--dur-slow) var(--ease-cut), opacity var(--dur-slow) var(--ease-cut); }
  .shot img.in { opacity: 1; }
  .shot:hover img { transform: scale(1.03); }
  .shot:focus-visible { outline-offset: -2px; outline-color: var(--ice); }
  .shot .by {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 12px 8px; text-align: left;
    font: italic 15px/1.3 var(--font-text); color: var(--white);
    background: linear-gradient(to top, var(--midnight-90), rgba(3, 31, 51, 0));
    opacity: 0; transition: opacity var(--dur-base) var(--ease-fade);
  }
  .shot:hover .by, .shot:focus-visible .by { opacity: 1; }

  .empty { padding: 40px 0; max-width: 520px; }
  .empty .btn { margin-top: 28px; }

  .lightbox {
    position: fixed; inset: 0; z-index: 50; display: none; grid-template-rows: auto 1fr auto;
    background: var(--midnight); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .lightbox.open { display: grid; animation: fade-in var(--dur-base) var(--ease-fade); }
  .lb-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 12px 20px; gap: 12px; }
  .lb-bar .btn { height: 40px; padding: 0 16px; font-size: 11px; }
  .lb-stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 64px; }
  .lb-stage img { max-height: 100%; max-width: 100%; object-fit: contain; min-height: 0; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 64px;
    display: grid; place-items: center; border: 0; background: transparent; color: var(--ice); cursor: pointer;
    transition: background var(--dur-fast) var(--ease-fade);
  }
  .lb-nav svg { width: 28px; height: 28px; stroke-width: 1.5; }
  .lb-nav:hover { background: var(--harbor); }
  .lb-prev { left: 8px; } .lb-next { right: 8px; }
  .lb-foot { padding: 12px 20px 18px; min-height: 54px; text-align: center; }
  @media (max-width: 600px) { .lb-stage { padding: 0; } .lb-nav { background: var(--midnight-70); } .lb-prev { left: 0; } .lb-next { right: 0; } }
</style>
</head>
<body>
<header class="site-header">
  <div class="stripe-bar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="bar">
    <a class="brand" href="https://830productions.com"><img src="assets/logo-white.png" alt="830 Productions" width="120" height="72"></a>
    <nav class="site-nav" aria-label="Event">
      <a id="navUpload" href="./">Add photos</a>
      <a id="navGallery" href="#" aria-current="page">Gallery</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <div>
      <p class="eyebrow">Now showing</p>
      <h1 class="title" id="eventTitle">The gallery</h1>
      <p class="title-meta" id="eventMeta" hidden></p>
      <p class="lede">Every photo your guests shared, in one place.</p>
      <div class="btn-row">
        <a class="btn" id="uploadBtn" href="./">Add your photos</a>
        <button class="btn outline" id="refresh" type="button">Refresh</button>
      </div>
    </div>
    <p class="count" id="count" aria-live="polite"><span id="countNum">—</span><small id="countLabel">Photos</small></p>
  </section>

  <section class="grid" id="grid" aria-label="Guest photos"></section>

  <section class="empty" id="empty" hidden>
    <h2 class="title sm" id="emptyTitle">Lights down.</h2>
    <p class="lede" id="emptyText">No photos yet. Be the first to add one.</p>
    <a class="btn" id="emptyBtn" href="./">Add the first photo</a>
  </section>
</main>

<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-bar">
    <span class="label" id="lbPos"></span>
    <div class="btn-row">
      <a class="btn outline" id="lbOpen" target="_blank" rel="noopener">Full size</a>
      <button class="btn outline" id="lbClose" type="button">Close</button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <img id="lbImg" alt="">
    <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next photo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <p class="lb-foot note" id="lbBy"></p>
</div>

<footer class="site-footer">
  <span class="tagline">Every frame matters.</span>
  <a href="https://830productions.com">830productions.com</a>
</footer>

<script src="config.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const S = window.Site830, event = S.event;
  const $ = id => document.getElementById(id);
  const src = (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w}`;
  const credit = p => p.by && p.by !== 'guest' ? `Shared by ${p.by.replace(/-/g, ' ')}` : '';
  const REFRESH_MS = 60000;
  let photos = [], current = 0, shown = null, lastFocus = null;

  if (event) {
    const up = S.link('upload.html');
    $('navUpload').href = $('uploadBtn').href = $('emptyBtn').href = up;
    $('navGallery').href = S.link('gallery.html');
  }

  const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.src = e.target.dataset.src; io.unobserve(e.target);
    });
  }, { rootMargin: '600px' }) : null;

  function load(quiet) {
    if (!event) return problem('This link is missing an event name.', true);
    if (!quiet) $('refresh').disabled = true;
    S.api('list', event, true)
      .then(d => {
        if (!d.ok) return problem(d.error, true);
        S.showTitle(d.title, $('eventTitle'), $('eventMeta'));
        document.title = `${d.title} · Gallery`;
        show(d.photos);
      })
      .catch(() => { if (!quiet) problem('The gallery didn’t load. Try refreshing in a moment.'); })
      .finally(() => { $('refresh').disabled = false; });
  }

  function problem(text, final) {
    if (photos.length && !final) return; // keep what's on screen if a refresh fails
    photos = []; shown = null; $('grid').innerHTML = '';
    $('countNum').textContent = '—';
    $('emptyTitle').textContent = 'This one didn’t load.';
    $('emptyText').textContent = text;
    $('emptyBtn').hidden = true; $('empty').hidden = false;
    $('uploadBtn').hidden = $('refresh').hidden = !!final && !event;
  }

  function show(list) {
    const key = list.map(p => p.id).join();
    if (key === shown) return; // nothing new: leave the grid alone
    shown = key; photos = list;
    $('countNum').textContent = list.length;
    $('countLabel').textContent = list.length === 1 ? 'Photo' : 'Photos';
    $('emptyTitle').textContent = 'Lights down.';
    $('emptyText').textContent = 'No photos yet. Be the first to add one.';
    $('emptyBtn').hidden = false; $('empty').hidden = list.length > 0;
    $('uploadBtn').hidden = list.length === 0; // the empty state carries the button instead

    const grid = $('grid'); grid.innerHTML = '';
    list.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'shot'; b.type = 'button';
      b.setAttribute('aria-label', `Open photo ${i + 1}` + (credit(p) ? `, ${credit(p).toLowerCase()}` : ''));
      const im = document.createElement('img');
      im.alt = ''; im.decoding = 'async'; im.dataset.src = src(p.id, 640);
      im.onload = () => { im.classList.add('in'); b.style.minHeight = '0'; };
      if (io) io.observe(im); else im.src = im.dataset.src;
      b.append(im);
      if (credit(p)) { const s = document.createElement('span'); s.className = 'by'; s.textContent = credit(p); b.append(s); }
      b.addEventListener('click', () => open(i));
      grid.append(b);
    });
  }

  // ---------- Viewer ----------
  const isOpen = () => $('lb').classList.contains('open');
  function open(i) {
    if (!photos.length) return;
    if (!isOpen()) lastFocus = document.activeElement;
    current = (i + photos.length) % photos.length;
    const p = photos[current];
    $('lbImg').src = src(p.id, 2000);
    $('lbOpen').href = `https://drive.google.com/file/d/${p.id}/view`;
    $('lbPos').textContent = `${current + 1} / ${photos.length}`;
    $('lbBy').textContent = credit(p);
    if (!isOpen()) { $('lb').classList.add('open'); document.body.style.overflow = 'hidden'; $('lbClose').focus(); }
    if (photos.length > 1) new Image().src = src(photos[(current + 1) % photos.length].id, 2000); // warm the next one
  }
  function close() {
    $('lb').classList.remove('open'); document.body.style.overflow = '';
    $('lbImg').removeAttribute('src');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  $('lbClose').onclick = close;
  $('lbPrev').onclick = () => open(current - 1);
  $('lbNext').onclick = () => open(current + 1);
  $('lbStage').addEventListener('click', e => { if (e.target === $('lbStage')) close(); });
  document.addEventListener('keydown', e => {
    if (!isOpen()) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') open(current - 1);
    if (e.key === 'ArrowRight') open(current + 1);
  });
  // Swipe on phones
  let x0 = null;
  $('lb').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  $('lb').addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) open(current + (dx < 0 ? 1 : -1));
  });

  // New photos appear on their own while the page is open and the viewer is closed.
  $('refresh').onclick = () => load();
  setInterval(() => { if (!document.hidden && !isOpen() && event) load(true); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !isOpen() && event) load(true); });
  load();
})();
</script>
</body>
</html>
